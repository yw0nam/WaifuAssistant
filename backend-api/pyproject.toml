[project]
name = "waifu-assistant-backend-api"
version = "0.1.0"
description = "Backend API for Waifu Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "yw0nam", email = "spow2544@gmail.com" }
]
maintainers = [
    { name = "yw0nam", email = "spow2544@gmail.com" }
]
keywords = ["AI", "Waifu", "Assistant", "LLM", "MCP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.115.12",
    "langchain>=0.3.25",
    "langchain-mcp-adapters>=0.1.7",
    "langchain-openai==0.3.23",
    "langgraph>=0.4.8",
    "librosa>=0.11.0",
    "websockets>=15.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.1",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.3",
    "black>=25.1.0",
    "isort>=6.0.1",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.7",
    "requests-mock>=1.12.1",
]

[project.urls]
"Repository" = "https://github.com/yw0nam/WaifuAssistant"

[project.scripts]
"backend-api" = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = [
    "-v",
    "--tb=short",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
